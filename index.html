<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EL COLGADO - by 87conde</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #2b2b45;
      --card: #1a1a2e;
      --accent: #facc15;
      --danger: #ef4444;
      --success: #22c55e;
      --text: #e2e8f0;
      --track: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body { 
      background-color: var(--bg); 
      color: var(--text); 
      font-family: 'VT323', monospace; 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      padding: 20px; 
      min-height: 100vh;
      text-transform: uppercase;
    }

    .container {
      width: 100%;
      max-width: 550px;
      margin-top: 5vh;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .pixel-box { 
      background: var(--card); 
      padding: 20px; 
      border: 4px solid #000; 
      box-shadow: 6px 6px 0px rgba(0,0,0,0.8); 
      text-align: center;
    }

    h1 { 
      font-size: 3.5rem; 
      color: var(--danger); /* Rojo lava para diferenciarlo del amarillo de La Horquilla */
      text-shadow: 4px 4px 0px #000; 
      margin-bottom: 5px;
      line-height: 1;
    }

    .signature { 
      font-size: 1.2rem; 
      color: var(--accent); 
    }

    .ascii-art {
      font-size: 1.5rem;
      white-space: pre;
      line-height: 1.2;
      margin: 20px 0;
      color: #fff;
    }

    .btn-pixel { 
      width: 100%; 
      background: var(--accent); 
      color: #000; 
      font-family: 'VT323'; 
      font-size: 1.8rem; 
      border: 4px solid #000; 
      box-shadow: 6px 6px 0px #000; 
      padding: 12px; 
      cursor: pointer; 
      transition: transform 0.1s, box-shadow 0.1s;
      text-decoration: none;
      display: inline-block;
      margin-top: 10px;
    }

    .btn-pixel:active { 
      transform: translate(6px, 6px); 
      box-shadow: 0px 0px 0px #000; 
    }
    
    .btn-return {
      background: var(--track);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="pixel-box">
      <h1>EL COLGADO</h1>
      <span class="signature">by 87conde</span>
      
      <!-- Zona de pruebas para el dibujo ASCII -->
      <div class="ascii-art">
   |
 [|||  ]
   O
  /|\
  / \
      </div>

      <p style="font-size: 1.5rem; color: var(--text-muted); margin-bottom: 15px;">
        Prueba de conexión exitosa.
      </p>

      <button id="btn-test" class="btn-pixel">BOTÓN DE PRUEBA</button>
      
      <!-- Enlace directo a tu otro juego -->
      <a href="https://alejandrocoonde.github.io/lahorquilla/" class="btn-pixel btn-return">
        ◀ VOLVER A LA HORQUILLA
      </a>
    </div>
  </div>

  <script>
    document.getElementById('btn-test').addEventListener('click', () => {
      alert("¡El JavaScript de El Colgado está funcionando perfectamente!");
    });
  </script>

</body>
</html>
